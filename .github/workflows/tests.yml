name: Verificar aplicação
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: estoque_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: estoque_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estoque_test -d estoque_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://estoque_test:test_only_password@localhost:5432/estoque_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: npm install --no-save jsdom fake-indexeddb
      - run: node --check static/app.js && node --check static/sw.js
      - run: node tests/ui.cjs
